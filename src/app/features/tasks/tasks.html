<div class="tasks-container">
    <h2>Tasks List</h2>
    @for (task of tasks(); track task.id) {
    <app-task-card [task]="task" (deleteTask)="onDeleteTask($event)"
        (updateTask)="onUpdateTask($event)"></app-task-card>
    @if(!isOpenComments()){
    <button (click)="openComments()">Show Comments</button>
    }
    @if(isOpenComments()){
    <app-comments [taskId]="task.id" (closeComments)="closeComments()"></app-comments>
    }
    } @empty {
    <p>All done! You don't have any tasks at the moment.</p>
    }
    <button (click)="addTask()">Add your first task</button>

</div>

@if(isAddingTask()){
<app-add-task (taskSave)="closeAddTask()"></app-add-task>
}
