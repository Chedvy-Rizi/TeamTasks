<div class="teams-page-container">
  <header class="page-header">
    <div class="header-text">
      <h1>Projects</h1>
      <p>Manage your professional projects and tasks</p>
    </div>
    
    <button class="btn-main-add" (click)="openAddProject()">
      <mat-icon>add</mat-icon>
      Add Project
    </button>
  </header>

  <div class="teams-grid">
    @for(project of projects(); track project.id) {
      <app-project-card 
        [project]="project" 
        (seeTasks)="onClickSeeTasks($event)">
      </app-project-card>
    }
  </div>
</div>
