

<div class="team-card">
  <div class="card-header">
    <h2 class="team-name">{{ taem().name }}</h2>
    <div class="members-badge">
      <mat-icon>groups</mat-icon>
      <span>{{ taem().members_count }}</span>
    </div>
  </div>

  <div class="card-body">
    <div class="info-item">
      <mat-icon>calendar_today</mat-icon>
      <span class="date-text">Created {{ taem().created_at }}</span>
    </div>
  </div>

  <button class="btn-add-member-small" (click)="onBtnClick()">
      <mat-icon>person_add</mat-icon>
      Add Member
    </button>
</div>
